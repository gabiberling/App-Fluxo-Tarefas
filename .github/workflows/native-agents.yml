# Etapa 03: controlador dos agentes nativos (Copilot) para issues abertas pelo app (origin:app).
# Roda sempre o código da main confiável; nunca executa código do PR com estas credenciais.
# Retomar manualmente: Actions > Agentes nativos > Run workflow, informando o número da issue.
name: Agentes nativos

on:
  issues:
    types: [opened, labeled]
  # pull_request_target usa a definição deste workflow na main (não a do PR); o checkout abaixo também é da main.
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue origin:app para retomar
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: native-agents-${{ github.event.issue.number || inputs.issue || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  controlar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'origin:app')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Controlador
        run: node automacao/controlador.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          AGENT_RUNTIME: ${{ vars.AGENT_RUNTIME || 'github-native' }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          INPUT_ISSUE: ${{ inputs.issue }}
