# Verificação mínima da aula (etapa 04): instalação pelo lockfile, build e testes existentes.
# Roda em push na main e em PRs de pessoas. PRs abertos pelo workflow dos agentes não disparam
# outros workflows (regra do GitHub); neles o "Agentes nativos" roda a mesma verificação sem token
# e publica o resultado como status do commit ("fluxo/build-e-testes").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
